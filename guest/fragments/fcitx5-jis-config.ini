[Hotkey]
# Handle mode changes in Fcitx's ordered key-event stream. A compositor
# subprocess can race the first character typed immediately after 英数.
ConsumeRedundantActivateKeys=True

[Hotkey/TriggerKeys]
0=Control+space
1=Zenkaku_Hankaku

[Hotkey/ActivateKeys]
# QEMU's JIS_Kana maps to KEY_HANGEUL / Hangul under XKB.
0=Hangul

[Hotkey/DeactivateKeys]
# QEMU's JIS_Eisu maps to KEY_HANJA / Hangul_Hanja under XKB.
0=Hangul_Hanja
